[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb_ota.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
; PlatformIO emits a ROM-safe DIO image header for qio, while selecting
; the qio bootloader/SDK. OPI is used by the external 8 MB PSRAM.
board_build.arduino.memory_type = qio_opi

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.1

; Use the source-contained 2.0.17 WebServer patch that never asks readBytes()
; for bytes beyond the declared Content-Length final raw chunk.
lib_ignore = WebServer

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=10
    -D TFT_DC=11
    -D TFT_RST=12
    -D USE_HSPI_PORT=1
