name: Build and package release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pin the image so the toolchain does not change when ubuntu-latest moves.
    # Must match .github/workflows/platformio.yml to avoid environment drift.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install pinned build and validation tools
        run: python -m pip install -r requirements-dev.txt

      - name: Build firmware
        run: pio run -e esp32s3_n16r8

      - name: Package release artifacts
        run: python tools/package_firmware.py

      - name: Verify packaged artifacts against fresh build
        run: python tools/check_packaged_artifacts.py

      - name: Commit and push artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/h2-gauge-v*-esp32s3-n16r8*.bin \
                     releases/SHA256SUMS-v*.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release: Linux-built artifacts"
            git push
          fi
