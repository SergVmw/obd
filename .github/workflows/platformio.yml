name: ESP32-S3 N16R8 firmware

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python -m pip install "platformio>=6.1,<7"

      - name: Test brightness, button gestures and NVS migration
        run: python tools/test_brightness.py

      - name: Check embedded UI and OTA invariants
        run: |
          python tools/check_brightness_integration.py
          python tools/check_ota_transport.py

      - name: Build ESP32-S3 N16R8 firmware
        run: pio run -e esp32s3_n16r8

      - name: Check per-slot firmware manifest
        run: python tools/check_firmware_manifest.py

      - name: Upload ESP32-S3 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h2-gauge-esp32s3-n16r8
          path: |
            .pio/build/esp32s3_n16r8/firmware.bin
            .pio/build/esp32s3_n16r8/bootloader.bin
            .pio/build/esp32s3_n16r8/partitions.bin
          if-no-files-found: error
