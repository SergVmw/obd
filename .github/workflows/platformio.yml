name: ESP32-S3 N16R8 firmware

on:
  push:
  pull_request:

jobs:
  firmware:
    # Pin the image so the toolchain does not change when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Full history and tags. check_doc_links.py verifies that every
          # repository link names a ref that exists, which it cannot judge from
          # a shallow clone with no tags: every ref would look broken. It also
          # resolves commit references, which needs history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned build and validation tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run host regression suites
        run: |
          python tools/test_brightness.py
          python tools/test_obd_diagnostics.py
          python tools/test_obd_client.py
          python tools/test_ota_diagnostics.py
          python tools/test_persistence.py
          python tools/test_storage_recovery.py
          python tools/test_mode22.py
          python tools/test_pid_support.py
          python tools/test_telemetry.py
          python tools/test_obd_trace.py
          python tools/test_screen_gate.py

      - name: Check embedded UI, fonts and OTA invariants
        run: |
          python tools/check_brightness_integration.py
          python tools/check_config_ranges.py
          python tools/check_doc_links.py
          python tools/check_stack_budget.py
          python tools/check_obd_service_integration.py
          python tools/check_dtc_integration.py
          python tools/check_storage_integration.py
          python tools/check_ota_transport.py
          python tools/check_speed_density_integration.py
          python tools/check_ui_fonts.py
          python tools/check_diagnostic_integration.py
          python tools/check_pid_support_report.py
          python tools/check_pid_names.py
          python tools/check_ci_coverage.py

      - name: Run browser OTA/UI regression
        run: |
          node tests/web/diagnostic_export.cjs
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          NODE_PATH="$PWD/node_modules" node tests/web/brightness_ui.cjs
          NODE_PATH="$PWD/node_modules" node tests/web/pidsupport_ui.cjs
          NODE_PATH="$PWD/node_modules" node tests/web/config_roundtrip.cjs
          NODE_PATH="$PWD/node_modules" node tests/web/config_first_load.cjs

      - name: Build ESP32-S3 N16R8 firmware
        run: pio run -e esp32s3_n16r8

      - name: Check build and committed release artifacts
        run: |
          # The version is read from the source rather than repeated here. It
          # was hardcoded, which meant every release either skipped checking
          # its own artifact or broke the job on a stale name.
          VERSION=$(sed -n 's/^#define H2G_FW_VERSION "\(.*\)"$/\1/p' include/version.h)
          TARGET=$(sed -n 's/^#define H2G_BUILD_TARGET "\(.*\)"$/\1/p' include/version.h)
          echo "Checking release artifacts for $VERSION / $TARGET"
          python tools/check_firmware_manifest.py
          python tools/check_firmware_manifest.py \
            "releases/h2-gauge-v${VERSION}-${TARGET}.bin" \
            --expected-version "$VERSION"
          (cd releases && sha256sum -c "SHA256SUMS-v${VERSION}.txt")
          python tools/check_packaged_artifacts.py

      - name: Upload ESP32-S3 build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: h2-gauge-esp32s3-n16r8
          path: |
            .pio/build/esp32s3_n16r8/firmware.bin
            .pio/build/esp32s3_n16r8/bootloader.bin
            .pio/build/esp32s3_n16r8/partitions.bin
          if-no-files-found: error
